name: Обновление статуса эфиров

# Планировщик Vercel на тарифе Hobby умеет только раз в сутки, а нам
# нужно раз в несколько минут. Поэтому дёргаем адрес отсюда: GitHub Actions
# бесплатны, живут в том же репозитории и переедут вместе с проектом.
#
# Когда сайт переберётся на Amvera, где есть обычный cron, этот файл
# можно будет удалить — а можно и оставить, он не мешает.

on:
  schedule:
    # Каждые 10 минут. GitHub не обещает точности: при нагрузке запуск
    # может задержаться на несколько минут. Для статуса «в эфире» это
    # некритично, а просить чаще смысла нет — точнее не станет.
    - cron: '*/10 * * * *'

  # Позволяет запустить вручную кнопкой во вкладке Actions.
  # Удобно для проверки, что всё настроено верно.
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Дёрнуть обновление
        env:
          URL: ${{ secrets.LIVE_REFRESH_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Ключ идёт ЗАГОЛОВКОМ, а не в адресе.
          #
          # Адрес попадает в журналы запуска, в историю и в логи сервера —
          # всюду, где его может прочитать посторонний. Заголовок туда
          # не пишется. Наш endpoint принимает оба способа, но раз есть
          # выбор, берём тот, что не оставляет следов.
          curl --fail --silent --show-error \
               --header "Authorization: Bearer $SECRET" \
               "$URL"
